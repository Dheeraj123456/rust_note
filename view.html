<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Notes Viewer</title>
  
  <!-- Link to your existing CSS stylesheet -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- Include Marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  
  <!-- Include the official PlantUML Encoder for secure compressions -->
  <script src="https://cdn.jsdelivr.net/npm/plantuml-encoder@1.4.0/dist/plantuml-encoder.min.js"></script>
</head>
<body>

  <!-- Theme Selector UI -->
  <div class="theme-selector-container">
    <label for="themeToggle">Theme:</label>
    <select id="themeToggle">
      <option value="light">☀️ Light</option>
      <option value="dark">🌙 Dark</option>
      <option value="sepia">📜 Sepia</option>
      <option value="nordic">🌲 Nordic</option>
    </select>
  </div>

  <!-- Main layout container -->
  <main id="content"></main>

  <!-- Link to your existing theme switcher script -->
  <script src="script.js"></script>

  <script>
    // 1. Setup custom syntax renderer to keep code syntax safe before processing
    const customRenderer = {
      code(code, infostring) {
        // Tag PlantUML blocks to prevent standard code highlighting from breaking them
        if (infostring === 'plantuml' || code.includes('@startuml')) {
          return `<pre class="plantuml-raw"><code>${code}</code></pre>`;
        }
        
        // Custom syntax highlighting for Rust codeblocks
        if (infostring === 'rust') {
          let highlighted = code
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            // Keywords
            .replace(/\b(let|fn|struct|impl|pub|use|mut|return|type)\b/g, '<span class="kw">$1</span>')
            // Strings
            .replace(/(".*?")/g, '<span class="st">$1</span>')
            // Numbers
            .replace(/\b([0-9]+i32|[0-9]+u64|[0-9]+)\b/g, '<span class="dv">$1</span>')
            // Comments
            .replace(/(\/\/.*)/g, '<span class="co">$1</span>')
            // Macros
            .replace(/\b(\w+!)\b/g, '<span class="fu">$1</span>');

          return `<pre class="sourceCode rust"><code>${highlighted}</code></pre>`;
        }
        
        // Fallback for standard ASCII diagram codes
        return `<pre><code>${code}</code></pre>`;
      }
    };

    marked.use({ renderer: customRenderer });

    async function initializeMarkdownRenderEngine() {
      const urlParams = new URLSearchParams(window.location.search);
      const targetFileName = urlParams.get('file');
      const viewContainer = document.getElementById('content');

      if (!targetFileName) {
        viewContainer.innerHTML = "<h1>Error</h1><p>No valid source target file specified.</p>";
        return;
      }

      try {
        const networkResponse = await fetch(targetFileName);
        if (!networkResponse.ok) throw new Error("File fetch failed.");
        const textPayloadData = await networkResponse.text();

        // 2. Render Markdown text into HTML elements inside our container
        viewContainer.innerHTML = marked.parse(textPayloadData);

        // 3. Post-Processing: Search specifically for tagged PlantUML segments
        const rawBlocks = viewContainer.querySelectorAll('.plantuml-raw, pre');
        rawBlocks.forEach((block) => {
          const text = block.textContent.trim();

          if (text.includes('@startuml') && text.includes('@enduml')) {
            const startIdx = text.indexOf('@startuml');
            const endIdx = text.indexOf('@enduml');
            
            if (startIdx !== -1 && endIdx !== -1) {
              const pumlCode = text.substring(startIdx, endIdx + 8).trim();

              try {
                // Compress and format diagram string safely
                const encoded = window.plantumlEncoder.encode(pumlCode);
                const diagramUrl = `https://www.plantuml.com/plantuml/svg/${encoded}`;

                // Create a beautiful, responsive, and legible image frame
                const img = document.createElement('img');
                img.src = diagramUrl;
                img.alt = "Rust Architecture Memory System";
                img.className = "puml-diagram";
                img.style.display = "block";
                img.style.margin = "2.5rem auto";
                img.style.maxWidth = "100%";
                img.style.height = "auto";
                img.style.borderRadius = "8px";
                img.style.padding = "14px";
                img.style.backgroundColor = "#ffffff"; // Forces high-contrast readability in dark modes
                img.style.boxShadow = "0 6px 16px rgba(0, 0, 0, 0.12)";

                // Perform the dynamic DOM node swap
                block.parentNode.replaceChild(img, block);
              } catch (encodeError) {
                console.error("PlantUML encoding failed:", encodeError);
              }
            }
          }
        });

        // Update dynamic window title tab header
        const coreHeaderTitle = viewContainer.querySelector('h1');
        if (coreHeaderTitle) document.title = coreHeaderTitle.textContent;

      } catch (faultSummary) {
        viewContainer.innerHTML = `<h1>System Error</h1><p>Unable to load the file "${targetFileName}". Please verify your repository pathing.</p>`;
      }
    }

    window.addEventListener('DOMContentLoaded', initializeMarkdownRenderEngine);
  </script>
</body>
</html>
