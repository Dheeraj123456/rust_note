<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Notes Viewer</title>
  <link rel="stylesheet" href="styles.css">
  
  <script src="[https://cdn.jsdelivr.net/npm/marked/marked.min.js](https://cdn.jsdelivr.net/npm/marked/marked.min.js)"></script>
</head>
<body>

  <div class="theme-selector-container">
    <label for="themeToggle">Theme:</label>
    <select id="themeToggle">
      <option value="light">☀️ Light</option>
      <option value="dark">🌙 Dark</option>
      <option value="sepia">📜 Sepia</option>
      <option value="nordic">🌲 Nordic</option>
    </select>
  </div>

  <main id="content"></main>

  <script src="script.js"></script>

  <script>
    // Custom syntax highlighting rules for Rust inside your theme
    const renderer = {
      code(code, infostring) {
        if (infostring === 'rust') {
          let highlighted = code
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            // Keywords
            .replace(/\b(let|fn|struct|impl|pub|use|mut|return|type)\b/g, '<span class="kw">$1</span>')
            // Strings
            .replace(/(".*?")/g, '<span class="st">$1</span>')
            // Numbers
            .replace(/\b([0-9]+i32|[0-9]+u64|[0-9]+)\b/g, '<span class="dv">$1</span>')
            // Comments
            .replace(/(\/\/.*)/g, '<span class="co">$1</span>')
            // Macros / Functions
            .replace(/\b(\w+!)\b/g, '<span class="fu">$1</span>');

          return `<pre class="sourceCode rust"><code>${highlighted}</code></pre>`;
        }
        // Fallback for plain ASCII text diagrams or unformatted blocks
        return `<pre><code>${code}</code></pre>`;
      }
    };

    marked.use({ renderer });

    async function initializeMarkdownRenderEngine() {
      const urlParams = new URLSearchParams(window.location.search);
      const targetFileName = urlParams.get('file');
      const viewContainer = document.getElementById('content');

      if (!targetFileName) {
        viewContainer.innerHTML = "<h1>Error</h1><p>No valid source file target specified.</p>";
        return;
      }

      try {
        const networkResponse = await fetch(targetFileName);
        if (!networkResponse.ok) throw new Error("File fetch failed.");
        let textPayloadData = await networkResponse.text();

        // --- PRE-PROCESSING SCANNER ---
        // This regex catches everything starting with ``` (plus any language tag) up to ```
        // and checks if it contains @startuml inside it.
        const codeBlockRegex = /```[\s\S]*?@startuml([\s\S]*?)@enduml[\s\S]*?```/g;
        
        textPayloadData = textPayloadData.replace(codeBlockRegex, (match, pumlContent) => {
          const cleanCode = pumlContent.trim();
          // Route the diagram parameters to Kroki
          const diagramUrl = `https://kroki.io/plantuml/svg/${encodeURIComponent(cleanCode)}`;
          return `\n\n<img src="${diagramUrl}" alt="Rust Architecture Diagram" class="puml-diagram" style="display:block; margin:1.5rem auto; max-width:100%; height:auto;">\n\n`;
        });

        // Run the main Markdown compiler on our newly cleaned text data stream
        viewContainer.innerHTML = marked.parse(textPayloadData);

        // Update document tab title dynamically
        const coreHeaderTitle = viewContainer.querySelector('h1');
        if (coreHeaderTitle) document.title = coreHeaderTitle.textContent;

      } catch (faultSummary) {
        viewContainer.innerHTML = `<h1>System Interruption Fault</h1><p>Could not read the markdown file or process data layout arrays smoothly.</p>`;
      }
    }

    window.addEventListener('DOMContentLoaded', initializeMarkdownRenderEngine);
  </script>
</body>
</html>
